[package]
name = "zerofish"
version = "0.1.0"
edition = "2021"
description = "UCI chess engine, a Rust port of the Java javafish engine"
license = "GPL-3.0-or-later"

[features]
default = ["rust-stockfish-nnue"]
rust-stockfish-nnue = []
# Optional linked oracle for comparisons; engine evaluation stays in Rust.
stockfish-nnue = []

[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.test]
opt-level = 3
